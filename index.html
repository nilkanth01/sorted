<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B111E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorted">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Sorted</title>
<meta name="description" content="Sorted: a student prototype that turns a fresher's flood of WhatsApp groups, emails and committee forms into one short list of what needs them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Left rail on desktop, bottom tabs on phones. One calm column where every item is triaged Must do / Your pick / FYI. */
:root{
  --bg:#F1F3F7;
  --surface:#FFFFFF;
  --surface-2:#E9EDF4;
  --ink:#0F1930;
  --ink-2:#465169;
  --ink-3:#6E7990;
  --line:#D8DEE8;
  --hl:#FFE14A;
  --hl-swipe:rgba(255,222,64,.8);
  --must:#C9372B; --must-tint:#FBEAE7;
  --pick:#2B53DB; --pick-tint:#E7EDFD;
  --fyi:#5A6780;  --fyi-tint:#ECEFF4;
  --ok:#14794F;   --ok-tint:#E2F3EA;
  --warn:#8F5400; --warn-tint:#FFF1D6;
  --hero-bg:#0F1930; --hero-ink:#F2F4F9; --hero-ink-2:#B3BDD0; --hero-dot:rgba(255,255,255,.13);
  --hero-must:#FF6A5C; --hero-pick:#86A2FF; --hero-fyi:#FFE14A;
  --shadow:0 1px 2px rgba(15,25,48,.05),0 12px 30px -14px rgba(15,25,48,.22);
  --f-display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r-sm:8px; --r-md:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111E; --surface:#131B2D; --surface-2:#1A2438; --ink:#E9EDF5; --ink-2:#AAB4C8; --ink-3:#8590A8; --line:#26314A;
    --hl:#F2D33C; --hl-swipe:rgba(242,211,60,.34);
    --must:#FF7A6D; --must-tint:rgba(255,122,109,.14); --pick:#8EA8FF; --pick-tint:rgba(142,168,255,.15);
    --fyi:#9DA9C0; --fyi-tint:rgba(157,169,192,.14); --ok:#55CF95; --ok-tint:rgba(85,207,149,.14);
    --warn:#F4B95A; --warn-tint:rgba(244,185,90,.14);
    --hero-bg:#17213A; --hero-ink:#F2F4F9; --hero-ink-2:#B3BDD0; --hero-dot:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#131B2D; --surface-2:#1A2438; --ink:#E9EDF5; --ink-2:#AAB4C8; --ink-3:#8590A8; --line:#26314A;
  --hl:#F2D33C; --hl-swipe:rgba(242,211,60,.34);
  --must:#FF7A6D; --must-tint:rgba(255,122,109,.14); --pick:#8EA8FF; --pick-tint:rgba(142,168,255,.15);
  --fyi:#9DA9C0; --fyi-tint:rgba(157,169,192,.14); --ok:#55CF95; --ok-tint:rgba(85,207,149,.14);
  --warn:#F4B95A; --warn-tint:rgba(244,185,90,.14);
  --hero-bg:#17213A; --hero-ink:#F2F4F9; --hero-ink-2:#B3BDD0; --hero-dot:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pick)}
:focus-visible{outline:2.5px solid var(--pick);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.hl{background:linear-gradient(180deg,transparent 56%,var(--hl-swipe) 56%,var(--hl-swipe) 92%,transparent 92%);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.rail{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;background:var(--bg);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:800 23px/1 var(--f-display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px}
.brand .proto{font:500 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 7px;margin-left:2px}
.me{display:flex;align-items:center;gap:10px;border-radius:999px;padding:3px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:#0F1930;font:700 14px/1 var(--f-display)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--ink-3);font:600 11.5px/1.1 var(--f-body)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke-width:2.3}
.tab .badge{position:absolute;top:2px;left:calc(50% + 6px)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--must);color:#fff;font:600 11px/18px var(--f-mono);text-align:center}
@media (min-width:900px){
  .shell{grid-template-columns:236px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}
  .rail .brand{padding:0 8px}
  .rail-nav{display:flex;flex-direction:column;gap:2px}
  .rail-nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:600;text-align:left}
  .rail-nav button:hover{background:var(--surface-2);color:var(--ink)}
  .rail-nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
  .rail-nav .badge{margin-left:auto}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
  .rail-foot .me{padding:8px;border-radius:12px;text-align:left}
  .rail-foot .me:hover{background:var(--surface-2)}
  .rail-foot .me small{display:block;color:var(--ink-3);font-size:12.5px}
  .rail-foot .note{font-size:12px;color:var(--ink-3);padding:0 8px;line-height:1.45}
  .topbar,.tabbar{display:none}
  .main{padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));padding-bottom:48px}
}

/* ---------- views ---------- */
#view{outline:none}
.view{max-width:760px;margin:0 auto;padding-block:12px 32px;display:flex;flex-direction:column;gap:22px}
.view.wide{max-width:1120px}
@media (min-width:900px){.view{padding-block:34px 40px}}
.page-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font:500 12px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.page-head h1{font:750 32px/1.08 var(--f-display);letter-spacing:-.025em}
.page-head p{color:var(--ink-2);max-width:60ch}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.section-title h2{font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.section-title .link{font-size:14px}
.link{color:var(--pick);font-weight:600}
.link:hover{text-decoration:underline}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);opacity:1}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn[aria-pressed="true"]{background:var(--pick);color:#fff}
.btn.ghost[aria-pressed="true"]{background:var(--pick-tint);color:var(--pick);border-color:transparent}
.btn svg.i{width:17px;height:17px}

.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.must{background:var(--must-tint);color:var(--must)}
.tag.pick{background:var(--pick-tint);color:var(--pick)}
.tag.pick::before{border-radius:2px}
.tag.fyi{background:var(--fyi-tint);color:var(--fyi)}
.tag.fyi::before{background:transparent;border:1.5px solid currentColor;width:5px;height:5px}
.tag.new{background:var(--hl);color:#0F1930}
.tag.new::before{display:none}

.due{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font:500 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.due svg.i{width:14px;height:14px}
.due.hot{background:var(--must-tint);color:var(--must)}
.due.soon{background:var(--warn-tint);color:var(--warn)}
.due.over{background:var(--must);color:#fff}
.due.done{background:var(--ok-tint);color:var(--ok)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:24px;border-radius:var(--r-lg);background:var(--hero-bg);color:var(--hero-ink);box-shadow:var(--shadow);overflow:hidden}
.hero .eyebrow{color:var(--hero-ink-2)}
.hero h1{font:700 26px/1.12 var(--f-display);letter-spacing:-.02em;margin-top:8px}
.hero .big{display:block;font:800 76px/.9 var(--f-display);letter-spacing:-.04em;color:var(--hero-fyi);margin-bottom:4px}
.hero .sub{margin-top:12px;color:var(--hero-ink-2);max-width:42ch}
.hero .sub b{color:var(--hero-ink);font-weight:600}
.hero .hl{background:linear-gradient(180deg,transparent 58%,rgba(255,225,74,.38) 58%,rgba(255,225,74,.38) 92%,transparent 92%);color:var(--hero-ink)}
.noise{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:5px;align-content:center}
.dot{aspect-ratio:1;border-radius:50%;background:var(--hero-dot)}
.dot.must{background:var(--hero-must)}
.dot.pick{background:var(--hero-pick);border-radius:3px}
.dot.fyi{background:transparent;box-shadow:inset 0 0 0 2px var(--hero-fyi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font:400 12px/1.3 var(--f-mono);color:var(--hero-ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--hero-dot);display:inline-block}
.legend i.must{background:var(--hero-must)}
.legend i.pick{background:var(--hero-pick);border-radius:2px}
.legend i.fyi{background:transparent;box-shadow:inset 0 0 0 2px var(--hero-fyi)}
@media (prefers-reduced-motion:no-preference){
  .dot.must,.dot.pick,.dot.fyi{animation:pop .9s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0ms)}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.9)}100%{transform:scale(1)}}
}
@media (min-width:700px){
  .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;padding:30px}
  .hero h1{font-size:30px}
  .hero .big{font-size:96px}
}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:14px;color:var(--ink-2)}
.banner p{flex:1;min-width:0}
.banner .x{color:var(--ink-3);padding:6px;border-radius:8px}
.banner .x:hover{background:var(--surface-2)}

.clash{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--warn-tint);color:var(--ink)}
.clash > svg.i{color:var(--warn);margin-top:2px}
.clash .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.clash b{color:var(--warn)}
.clash .acts{display:flex;flex-wrap:wrap;gap:8px}

.today-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.today-main,.today-side{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:1180px){.today-grid{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.wday:hover{border-color:var(--ink-3)}
.wday b{font:700 17px/1 var(--f-display);color:var(--ink)}
.wday small{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.wday .pips{display:flex;gap:3px;min-height:7px}
.wday .pips i{width:7px;height:7px;border-radius:50%;background:var(--must)}
.wday .pips i.pick{background:var(--pick);border-radius:2px}
.wday.today{border-color:var(--ink)}
.wday[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wday[aria-pressed="true"] b{color:var(--bg)}

/* task list */
.tasks{list-style:none;display:flex;flex-direction:column}
.dayhead{display:flex;align-items:center;gap:10px;padding:16px 16px 8px;font:500 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.dayhead + .task{border-top:0}
.chk{position:relative;display:grid;place-items:center;width:26px;height:26px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{width:22px;height:22px;border-radius:50%;border:2px solid var(--must);display:grid;place-items:center;transition:background .15s}
.task.pick .chk span{border-color:var(--pick);border-radius:6px}
.chk span svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.chk input:checked + span{background:var(--ok);border-color:var(--ok)}
.chk input:checked + span svg{opacity:1}
.chk input:focus-visible + span{outline:2.5px solid var(--pick);outline-offset:2px}
.task-main{display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.task-title{font-weight:600;font-size:15.5px;line-height:1.3;color:var(--ink)}
.task-main:hover .task-title{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.task-meta{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 8px}
.task-meta .when{font-family:var(--f-mono);font-size:12.5px}
.task.is-done .task-title{text-decoration:line-through;color:var(--ink-3)}
.task.is-done .task-meta{color:var(--ink-3)}
.task-end{display:flex;align-items:center;gap:8px}
@media (max-width:560px){
  .task{grid-template-columns:auto minmax(0,1fr);align-items:start;column-gap:12px;row-gap:8px}
  .task .chk{margin-top:-2px}
  .task-end{grid-column:2}
  .task.fyi .task-end{display:none}
  .task.fyi{align-items:center}
}
.list-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}

/* side cards */
.mini{display:flex;flex-direction:column;gap:12px;padding:18px}
.mini h3{font:700 16px/1.25 var(--f-display)}
.mini .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stat{font:800 34px/1 var(--f-display);letter-spacing:-.03em}
.stat small{font:500 13px/1 var(--f-body);color:var(--ink-2);letter-spacing:0;margin-left:4px}
.bar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ok)}
.digest-list{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.digest-list li{display:flex;gap:10px;align-items:baseline}
.digest-list li .mono{color:var(--ink-3);font-size:12px;min-width:64px}

/* updates */
.toolbar{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search svg.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:46px;padding:0 14px 0 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:600}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-weight:500;opacity:.7;margin-left:4px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink)}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--pick)}
.switch input:checked::after{transform:translateX(16px)}
.feed{display:flex;flex-direction:column;gap:12px}
.upd{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.upd.fresh{box-shadow:0 0 0 2px var(--hl)}

/* ================= time helpers ================= */
const NOW = new Date();
const HOUR = 36e5, DAY = 864e5;

const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function at(d, hm){ const p = hm.split(':').map(Number); const x = new Date(NOW); x.setDate(x.getDate()+d); x.setHours(p[0],p[1],0,0); return x; }
function ago(h){ return new Date(NOW.getTime() - h*HOUR); }
function sod(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayDiff(d){ return Math.round((sod(d) - sod(NOW)) / DAY); }
function fmtTime(d){ let h = d.getHours(); const m = d.getMinutes(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + String(m).padStart(2,'0') + ' ' + ap; }
function fmtDay(d){ const n = dayDiff(d); if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday'; if(n>1 && n<7) return WD[d.getDay()]; return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MO[d.getMonth()]; }
function fmtWhen(d, end){ return fmtDay(d) + ', ' + fmtTime(d) + (end ? '–' + fmtTime(end) : ''); }
function dayName(n){ const d = at(n,'12:00'); return n===0 ? 'today' : n===1 ? 'tomorrow' : WDL[d.getDay()]; }
function dayShort(n){ const d = at(n,'12:00'); return WD[d.getDay()]; }

function countdown(d){

  const mins = Math.floor(ms/6e4);
  if(mins < 60) return {txt: mins + ' min left', cls:'hot'};

/* ================= state ================= */
const KEY = 'sorted.v1';
const DEFAULT_STATE = {
  profile:{name:'Riya', prog:'BM', sec:'B', digest:'20:00', mustOnly:true},
  following:['fin','cons','mkt','ana','cult','sports','mess','lib','quiz'],
  shortlisted:['cons','mkt','ana'],
  done:[], guideDone:['g2','g3','g4'], reminders:[], posts:[], banner:true

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const s = JSON.parse(raw); return Object.assign(clone(DEFAULT_STATE), s, {profile:Object.assign({}, DEFAULT_STATE.profile, s.profile||{})}); } }catch(e){}
  return clone(DEFAULT_STATE);
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const has = (arr, v) => arr.indexOf(v) !== -1;
function toggleIn(arr, v){ const i = arr.indexOf(v); if(i === -1) arr.push(v); else arr.splice(i,1); return i === -1; }

/* ui-only state */
const ui = {route:'today', day:null, q:'', cat:'all', followOnly:true, cfilter:'all', gq:'', fresh:null, resetArmed:false};

/* ================= derived data ================= */
function postToItem(p){ return Object.assign({}, p, {posted:new Date(p.posted), due:p.due ? new Date(p.due) : null, end:null, mine:true}); }
function allUpdates(){ return state.posts.map(postToItem).concat(UPDATES); }
function audOk(u){ if(!u.aud || u.aud === 'all' || u.aud === 'mysec') return true; if(u.aud === 'BM' || u.aud === 'HRM') return u.aud === state.profile.prog; if(u.aud.indexOf('sec:') === 0) return u.aud.slice(4) === state.profile.sec; return true; }
function audLabel(a){ if(!a || a === 'all') return 'All first-years'; if(a === 'mysec') return 'Section ' + state.profile.sec; if(a === 'BM' || a === 'HRM') return a + ' 2026–28'; if(a.indexOf('sec:') === 0) return 'Section ' + a.slice(4); return a; }
function srcVisible(u){ return u.mine || SRC[u.src].off || has(state.following, u.src); }
function findUpdate(id){ return allUpdates().find(u => u.id === id); }
function findCommittee(id){ return COMMITTEES.find(c => c.id === id); }

function needItems(){
  const out = [];
  allUpdates().forEach(u => {
    if(u.pri === 'must' && u.action && u.due && audOk(u)) out.push({kind:'u', id:u.id, title:u.title, src:SRC[u.src].n, action:u.action, due:u.due, end:u.end, pri:'must'});
  });
  COMMITTEES.forEach(c => {
    if(!has(state.shortlisted, c.id)) return;
    c.rounds.forEach((r,i) => { if(r.due >= NOW) out.push({kind:'r', id:'r:'+c.id+':'+i, cid:c.id, title:c.name + ': ' + r.t, src:c.name, action:r.note, due:r.due, end:r.end, pri:'pick'}); });
  });
  return out.sort((a,b) => a.due - b.due);
}
function clashes(items){
  const timed = items.filter(x => x.end);
  const res = [];
  for(let i=0;i<timed.length;i++) for(let j=i+1;j<timed.length;j++){
    const a = timed[i], b = timed[j];
    if(a.due < b.end && b.due < a.end) res.push([a,b]);
  }
  return res;
}
function loadRange(){ let lo = 0, hi = 0; state.shortlisted.forEach(id => { const c = findCommittee(id); if(c){ lo += c.hrs[0]; hi += c.hrs[1]; } }); return [lo,hi]; }

/* ================= TODAY ================= */
function greet(){ const h = NOW.getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function noiseField(sig){
  const N = 126, map = {};
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  sig.forEach(k => { let p, guard = 0; do{ p = Math.floor(rnd()*N); guard++; } while(map[p] && guard < 500); map[p] = k; });
  let s = '';
  for(let i=0;i<N;i++) s += map[i] ? '<i class="dot ' + map[i] + '" style="--d:' + (300 + (i%18)*35) + 'ms"></i>' : '<i class="dot"></i>';
  return s;
}
function taskRow(x){
  const done = has(state.done, x.id);
  const cd = done ? {txt:'Done', cls:'done'} : countdown(x.due);
  return '<li class="task ' + x.pri + (done ? ' is-done' : '') + '">' +
    '<label class="chk"><input type="checkbox" id="done-' + esc(x.id) + '" data-act="done" data-id="' + esc(x.id) + '"' + (done ? ' checked' : '') + '><span>' + ico('check') + '</span><span class="vh">Mark “' + esc(x.title) + '” as done</span></label>' +
    '<button class="task-main" data-act="open" data-kind="' + x.kind + '" data-id="' + esc(x.kind === 'r' ? x.cid : x.id) + '">' +
      '<span class="task-title">' + esc(x.title) + '</span>' +
      '<span class="task-meta"><span class="when">' + esc(fmtWhen(x.due, x.end)) + '</span><span>' + esc(x.action) + '</span></span>' +
    '</button>' +
    '<span class="task-end"><span class="due ' + cd.cls + '"' + (done ? '' : ' data-due="' + x.due.getTime() + '"') + '>' + ico('clock') + '<span>' + esc(cd.txt) + '</span></span></span>' +
  '</li>';
}
function viewToday(){
  const items = needItems();
  const weekEnd = sod(NOW).getTime() + 7*DAY;
  const open = items.filter(x => !has(state.done, x.id));
  const thisWeek = open.filter(x => x.due.getTime() < weekEnd);
  const in24 = open.filter(x => x.due - Date.now() < DAY).length;
  const fyiAll = allUpdates().filter(u => u.pri !== 'must' && srcVisible(u) && audOk(u));
  const sig = thisWeek.map(x => x.pri).concat(fyiAll.slice(0,6).map(() => 'fyi'));
  const cl = clashes(open);

  // week strip
  let week = '';
  for(let d=0; d<7; d++){
    const day = at(d,'12:00');
    const its = items.filter(x => dayDiff(x.due) === d);
    week += '<button class="wday' + (d===0 ? ' today' : '') + '" data-act="day" data-day="' + d + '" aria-pressed="' + (ui.day === d) + '" aria-label="' + WDL[day.getDay()] + ', ' + its.length + ' items">' +
      '<small>' + (d===0 ? 'Today' : WD[day.getDay()]) + '</small><b>' + day.getDate() + '</b>' +
      '<span class="pips">' + its.slice(0,4).map(x => '<i class="' + x.pri + '"></i>').join('') + '</span></button>';
  }

  // grouped task list
  const shown = items.filter(x => (ui.day === null ? x.due.getTime() < weekEnd : dayDiff(x.due) === ui.day));
  const later = ui.day === null ? items.filter(x => x.due.getTime() >= weekEnd).length : 0;
  let list = '', lastDay = null;
  shown.forEach(x => {
    const dd = dayDiff(x.due);
    if(dd !== lastDay){ lastDay = dd; list += '<li class="dayhead" role="presentation">' + esc(dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : WDL[x.due.getDay()] + ' ' + x.due.getDate() + ' ' + MO[x.due.getMonth()]) + '</li>'; }
    list += taskRow(x);
  });
  if(!shown.length) list = '<li class="empty">Nothing due ' + (ui.day === null ? 'this week' : 'on this day') + '. Enjoy it.</li>';

  // clash banner
  let clashHtml = '';
  if(cl.length){
    const [a,b] = cl[0];

  const cd = u.due ? (has(state.done, u.id) ? {txt:'Done', cls:'done'} : countdown(u.due)) : null;
  let btn = '';
  if(u.ref) btn = '<button class="btn sm ghost" data-act="open" data-kind="r" data-id="' + esc(u.ref) + '">' + ico('users') + 'See committee</button>';
  else if(u.action && u.actionType === 'remind') btn = '<button class="btn sm ghost" data-act="remind" data-id="' + esc(u.id) + '" aria-pressed="' + has(state.reminders, u.id) + '">' + ico('bell') + (has(state.reminders, u.id) ? 'In your digest' : 'Remind me') + '</button>';
  else if(u.action) btn = '<button class="btn sm" data-act="go" data-id="' + esc(u.id) + '">' + esc(u.action) + ico('arrow') + '</button>';
  const rawWords = words(u.raw), tlWords = words(u.tldr);
  return '<article class="upd' + (ui.fresh === u.id ? ' fresh' : '') + '" id="card-' + esc(u.id) + '">' +
    '<div class="upd-head">' + (u.mine && ui.fresh === u.id ? '<span class="tag new">New</span>' : '') + '<span class="tag ' + u.pri + '">' + tagTxt + '</span><span class="src">' + esc(SRC[u.src].n) + '</span><span class="dotsep">·</span><span>' + esc(fmtAgo(u.posted)) + '</span><span class="dotsep">·</span><span>' + esc(audLabel(u.aud)) + '</span></div>' +
    '<h3>' + esc(u.title) + '</h3><p class="tldr">' + esc(u.tldr) + '</p>' +
    '<div class="upd-foot">' + (cd ? '<span class="due ' + cd.cls + '"' + (cd.cls === 'done' ? '' : ' data-due="' + u.due.getTime() + '"') + '>' + ico('clock') + '<span>' + esc(cd.txt) + '</span></span>' : '') + btn + '<span class="spacer"></span>' +
      (u.raw ? '<button class="link" data-act="raw" data-id="' + esc(u.id) + '" aria-expanded="false" aria-controls="raw-' + esc(u.id) + '" style="font-size:14px">Original message</button>' : '') + '</div>' +
    (u.raw ? '<div class="raw" id="raw-' + esc(u.id) + '" hidden><div class="bubble"><span class="grp">' + esc(u.grp || SRC[u.src].n) + '</span>' + (u.pri !== 'must' || u.src === 'admin' ? '<span class="fwd">Forwarded</span>' : '') + esc(u.raw) + '<span class="ts">' + esc(fmtTime(u.posted)) + '</span></div><p class="raw-note">Original: ' + rawWords + ' words · Sorted summary: ' + tlWords + ' words</p></div>' : '') +
  '</article>';
}
function filteredUpdates(){
  const q = ui.q.trim().toLowerCase();
  const base = allUpdates().filter(audOk);
  const vis = base.filter(u => !ui.followOnly || srcVisible(u));
  const byCat = vis.filter(u => ui.cat === 'all' ? true : ui.cat === 'action' ? (u.pri === 'must' && !!u.action) : u.cat === ui.cat);
  const res = q ? byCat.filter(u => (u.title + ' ' + u.tldr + ' ' + (u.raw||'') + ' ' + SRC[u.src].n).toLowerCase().indexOf(q) !== -1) : byCat;
  res.sort((a,b) => (b.mine === true) - (a.mine === true) || b.posted - a.posted);
  return {res, hidden: base.length - vis.length, vis};
}
function renderFeed(){
  const f = filteredUpdates();
  const el = document.getElementById('feed'); if(!el) return;
  el.innerHTML = f.res.length ? f.res.map(updCard).join('') : '<div class="panel empty">No updates match. Try another filter or clear the search.</div>';
  const cl = document.getElementById('count-line');
  if(cl) cl.textContent = 'Showing ' + f.res.length + ' update' + (f.res.length === 1 ? '' : 's') + (ui.followOnly && f.hidden ? ' · ' + f.hidden + ' hidden from clubs you don’t follow' : '');

}
function viewUpdates(){
  const vis = allUpdates().filter(audOk).filter(u => !ui.followOnly || srcVisible(u));

      '<div class="chips" role="group" aria-label="Filter updates">' + chips.map(c => '<button class="chip" data-act="cat" data-cat="' + c[0] + '" aria-pressed="' + (ui.cat === c[0]) + '">' + c[1] + '<span class="n">' + n(c[0]) + '</span></button>').join('') + '</div>' +

    '<div class="feed" id="feed"></div></div>';

/* ================= POST ================= */
const POST_DEFAULT = () => ({src:'quiz', title:'Sign up for the Freshers’ Quiz', tldr:'Teams of 2, any section. Prelims are in the auditorium. Sign-up takes one minute.', cat:'events', aud:'all', type:'action', pri:'pick', action:'Sign up · 1 min', due:toLocalInput(at(2,'18:00')), raw:''});
let draft = POST_DEFAULT();
function postChecks(d){
  const shouty = /\b[A-Z]{4,}\b/.test(d.title + ' ' + d.tldr);
  const filler = /(pfa|kindly|ignore if (already )?done|gentle reminder|asap|!!)/i.test(d.title + ' ' + d.tldr);
  return [
    {ok: d.title.trim().length >= 8 && d.title.length <= 70, txt:'Title says what to do in under 70 characters'},
    {ok: d.tldr.trim().length > 0 && d.tldr.length <= 120, txt:'One-line summary fits in 120 characters'},
    {ok: d.type !== 'action' || (!!d.due && !!d.action.trim()), txt:'Action and deadline are in their own fields'},
    {ok: !shouty && !filler, txt:'No ALL CAPS, “PFA”, “kindly” or “ignore if done”. Sorted only shows it to people who still need it.'}
  ];
}
function waText(d){
  const due = d.due ? new Date(d.due) : null;
  const lines = [];
  const lab = d.type === 'action' ? (d.pri === 'must' ? '[MUST DO]' : '[OPTIONAL]') : '[FYI]';
  lines.push('*' + lab + ' ' + (d.title.trim() || 'Your title') + '*');
  lines.push(d.tldr.trim() || 'Your one-line summary');
  lines.push('');
  lines.push('For: ' + audLabel(d.aud));
  if(d.type === 'action'){ lines.push('Do: ' + (d.action.trim() || '—')); if(due && !isNaN(due)) lines.push('By: ' + WD[due.getDay()] + ' ' + due.getDate() + ' ' + MO[due.getMonth()] + ', ' + fmtTime(due)); }
  lines.push('From: ' + SRC[d.src].n);
  lines.push('');
  lines.push('Full details and reminders in Sorted.');
  return lines.join('\n');
}
function previewItem(d){
  return {id:'preview', src:d.src, cat:d.cat, pri:d.type === 'action' ? d.pri : 'fyi', aud:d.aud, posted:new Date(), title:d.title.trim() || 'Your title', tldr:d.tldr.trim() || 'Your one-line summary', action:d.type === 'action' ? (d.action.trim() || 'Do it') : null, due:d.type === 'action' && d.due ? new Date(d.due) : null, raw:d.raw.trim() || null};
}

    '<p class="preview-label">WhatsApp version to forward</p><div class="wa" id="wa-text">' + esc(waText(draft)) + '</div>';

  const actWrap = document.getElementById('action-fields'); if(actWrap) actWrap.hidden = draft.type !== 'action';
}
function viewPost(){

  const catOpts = Object.keys(CATS).map(k => '<option value="' + k + '"' + (d.cat === k ? ' selected' : '') + '>' + CATS[k] + '</option>').join('');
  const auds = [['all','All first-years'],['BM','BM 2026–28'],['HRM','HRM 2026–28']].concat('ABCDEF'.split('').map(s => ['sec:'+s,'Section '+s]));
  const audOpts = auds.map(a => '<option value="' + a[0] + '"' + (d.aud === a[0] ? ' selected' : '') + '>' + a[1] + '</option>').join('');
  const seg = (name, val, label) => '<label><input type="radio" name="' + name + '" id="' + name + '-' + val + '" value="' + val + '"' + (d[name] === val ? ' checked' : '') + '><span>' + label + '</span></label>';
  return '<div class="view wide">' +
    '<div class="page-head"><p class="eyebrow">For committees, CRs and offices</p><h1>Post once. Reach every fresher who needs it.</h1><p>Fill a short form instead of writing a long message. Sorted shows it only to the right people, reminds those who have not acted, and gives you a clean WhatsApp version to forward.</p></div>' +
    '<div class="post-grid"><form class="panel form" id="post-form" novalidate>' +
      '<div class="two"><div class="field"><label for="p-src">Posting as</label><select id="p-src" name="src">' + srcOpts + '</select></div><div class="field"><label for="p-aud">Who is it for</label><select id="p-aud" name="aud">' + audOpts + '</select></div></div>' +
      '<div class="field"><label for="p-title">Title</label><input type="text" id="p-title" name="title" maxlength="90" value="' + esc(d.title) + '"><span class="hint">Start with a verb: “Submit…”, “Sign up for…”, “Collect…”</span></div>' +
      '<div class="field"><label for="p-tldr">One-line summary</label><textarea id="p-tldr" name="tldr" rows="2">' + esc(d.tldr) + '</textarea><span class="counter" id="tldr-count"></span></div>' +
      '<div class="field"><label for="p-cat">Category</label><select id="p-cat" name="cat">' + catOpts + '</select></div>' +
      '<fieldset class="field"><legend>Does it need people to do something?</legend><div class="seg">' + seg('type','action','Yes, it needs action') + seg('type','info','No, just information') + '</div></fieldset>' +
      '<div id="action-fields" style="display:flex;flex-direction:column;gap:16px"' + (d.type === 'action' ? '' : ' hidden') + '>' +
        '<fieldset class="field"><legend>Is it compulsory?</legend><div class="seg">' + seg('pri','must','Must do for everyone') + seg('pri','pick','Optional') + '</div></fieldset>' +
        '<div class="two"><div class="field"><label for="p-action">Action button</label><input type="text" id="p-action" name="action" maxlength="30" value="' + esc(d.action) + '"><span class="hint">e.g. “Fill form · 3 min”</span></div>' +
        '<div class="field"><label for="p-due">Deadline</label><input type="datetime-local" id="p-due" name="due" value="' + esc(d.due) + '"></div></div></div>' +
      '<div class="field"><label for="p-raw">Full details (optional)</label><textarea id="p-raw" name="raw" rows="3" placeholder="Rules, venue, links. Shown under “Original message”.">' + esc(d.raw) + '</textarea></div>' +
      '<p class="err" id="post-err" hidden></p>' +
      '<div class="form-acts"><button type="submit" class="btn">' + ico('check') + 'Publish to Sorted</button><button type="button" class="btn ghost" data-act="copy-wa">' + ico('copy') + 'Copy WhatsApp text</button><button type="button" class="btn ghost" data-act="clear-post">Clear</button></div>' +
    '</form><div class="post-preview preview-stack" id="post-preview" aria-live="polite"></div></div></div>';
}

/* ================= sheets ================= */
let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  const s = document.getElementById('sheet');
  s.innerHTML = html;
  document.getElementById('backdrop').hidden = false;
  document.body.style.overflow = 'hidden';
  const f = s.querySelector('[data-autofocus]') || s.querySelector('button, [href], input, select, textarea');
  if(f) f.focus();
}
function closeSheet(){
  document.getElementById('backdrop').hidden = true;
  document.body.style.overflow = '';
  ui.resetArmed = false;
  if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function sheetHead(title, sub){ return '<div class="sheet-head"><div>' + (sub || '') + '<h2 id="sheet-title">' + esc(title) + '</h2></div><button class="close" data-act="close" aria-label="Close">' + ico('x') + '</button></div>'; }
function openUpdate(id){
  const u = findUpdate(id); if(!u) return;
  const done = has(state.done, u.id);
  const tagTxt = u.pri === 'must' ? 'Must do' : u.pri === 'pick' ? 'Club' : 'FYI';
  let acts = '';
  if(u.pri === 'must' && u.action && u.due) acts += '<button class="btn" data-act="done-btn" data-id="' + esc(u.id) + '">' + ico('check') + (done ? 'Mark as not done' : 'Mark as done') + '</button>';
  if(u.action && u.actionType !== 'remind') acts += '<button class="btn ghost" data-act="go" data-id="' + esc(u.id) + '">' + esc(u.action) + ico('arrow') + '</button>';
  if(u.due) acts += '<button class="btn ghost" data-act="remind" data-id="' + esc(u.id) + '" aria-pressed="' + has(state.reminders, u.id) + '">' + ico('bell') + (has(state.reminders, u.id) ? 'In your digest' : 'Remind me') + '</button>';
  if(u.ref) acts += '<button class="btn ghost" data-act="open" data-kind="r" data-id="' + esc(u.ref) + '">' + ico('users') + 'See committee</button>';
  openSheet(sheetHead(u.title, '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag ' + u.pri + '">' + tagTxt + '</span>' + (u.due ? '<span class="due ' + (done ? 'done' : countdown(u.due).cls) + '">' + ico('clock') + (done ? 'Done' : esc(countdown(u.due).txt)) + '</span>' : '') + '</div>') +
    '<p class="tldr-big">' + esc(u.tldr) + '</p>' +
    '<dl class="kv"><dt>From</dt><dd>' + esc(SRC[u.src].n) + '</dd><dt>For</dt><dd>' + esc(audLabel(u.aud)) + '</dd>' + (u.due ? '<dt>' + (u.end ? 'When' : 'Due') + '</dt><dd>' + esc(fmtWhen(u.due, u.end)) + '</dd>' : '') + '<dt>Posted</dt><dd>' + esc(fmtAgo(u.posted)) + '</dd></dl>' +
    (acts ? '<div class="acts">' + acts + '</div>' : '') +
    (u.raw ? '<div class="raw"><p class="preview-label">Original message</p><div class="bubble"><span class="grp">' + esc(u.grp || SRC[u.src].n) + '</span>' + esc(u.raw) + '<span class="ts">' + esc(fmtTime(u.posted)) + '</span></div><p class="raw-note">Original: ' + words(u.raw) + ' words · Sorted summary: ' + words(u.tldr) + ' words</p></div>' : ''));
}
function openCommittee(id){
  const c = findCommittee(id); if(!c) return;
  const on = has(state.shortlisted, c.id), fol = has(state.following, c.id);
  openSheet(sheetHead(c.name, '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="fact">' + ico('hours') + c.hrs[0] + '–' + c.hrs[1] + ' hrs/week</span>' + (on ? '<span class="tag pick">Shortlisted</span>' : '') + '</div>') +
    '<p class="tldr-big">' + esc(c.what) + '</p>' +
    '<div><p class="preview-label" style="margin-bottom:12px">Recruitment rounds</p><ol class="rounds">' + c.rounds.map((r,i) => '<li class="' + (r.due < NOW ? 'past' : '') + '"><span class="node">' + (r.due < NOW ? '' : i+1) + '</span><div><b>' + esc(r.t) + '</b><small class="mono">' + esc(fmtWhen(r.due, r.end)) + (r.due < NOW ? ' · closed' : '') + '</small><small>' + esc(r.note) + '</small></div></li>').join('') + '</ol></div>' +
    '<div class="quote">“' + esc(c.tip) + '”<cite>A second-year member</cite></div>' +
    '<div class="acts"><button class="btn' + (on ? '' : '') + '" data-act="short" data-id="' + c.id + '" aria-pressed="' + on + '">' + ico(on ? 'check' : 'plus') + (on ? 'Shortlisted' : 'Shortlist') + '</button><button class="btn ghost" data-act="follow" data-id="' + c.id + '" aria-pressed="' + fol + '">' + ico('bell') + (fol ? 'Following' : 'Follow') + '</button></div>');
}
function findNeed(id){ return needItems().find(x => x.id === id); }
function openClashDraft(aId, bId){
  const a = findNeed(aId), b = findNeed(bId); if(!a || !b) return;
  // ask to move the committee round; if both are committee rounds, move the later-starting one
  let move = b, keep = a;
  if(a.kind === 'r' && b.kind !== 'r'){ move = a; keep = b; }
  else if(a.kind === 'r' && b.kind === 'r' && a.due > b.due){ move = a; keep = b; }
  const p = state.profile;
  const name = x => x.kind === 'r' ? 'the ' + x.src + ' ' + x.title.slice(x.title.indexOf(': ') + 2).toLowerCase() : x.title;
  const txt = 'Hi! I’m ' + p.name + ' from Section ' + p.sec + ' (' + p.prog + ' 2026–28). My slot for ' + name(move) + ' (' + fmtDay(move.due) + ', ' + fmtTime(move.due) + ') clashes with ' + name(keep) + ' (' + fmtTime(keep.due) + '–' + fmtTime(keep.end) + '). Could I please move to a later slot? Happy to take any time that works for you. Thank you!';
  openSheet(sheetHead('Ask for a new slot', '<span class="tag pick">' + esc(move.src) + '</span>') +
    '<p class="muted">Committees keep backup slots for clashes. Here is a short, polite message you can send to the ' + esc(move.src) + ' coordinators. Edit it if you like.</p>' +
    '<label class="vh" for="draft-text">Message</label><textarea class="draft" id="draft-text">' + esc(txt) + '</textarea>' +
    '<div class="acts"><button class="btn" data-act="copy-draft" data-autofocus>' + ico('copy') + 'Copy message</button><button class="btn ghost" data-act="close">Done</button></div>');
}
function openProfile(){
  const p = state.profile;
  const opts = Object.keys(SRC).filter(k => !SRC[k].off).map(k => '<label><input type="checkbox" id="pf-f-' + k + '" value="' + k + '"' + (has(state.following, k) ? ' checked' : '') + '>' + esc(SRC[k].n) + '</label>').join('');
  const digest = [['19:00','7:00 pm'],['20:00','8:00 pm'],['21:00','9:00 pm'],['off','Off']].map(o => '<option value="' + o[0] + '"' + (p.digest === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('');
  openSheet(sheetHead('Make Sorted yours', '<p class="eyebrow">Profile and settings</p>') +
    '<form id="profile-form" class="preview-stack" novalidate>' +
      '<div class="two"><div class="field"><label for="pf-name">First name</label><input type="text" id="pf-name" value="' + esc(p.name) + '" maxlength="24" data-autofocus></div>' +
      '<div class="two"><div class="field"><label for="pf-prog">Programme</label><select id="pf-prog"><option' + (p.prog === 'BM' ? ' selected' : '') + '>BM</option><option' + (p.prog === 'HRM' ? ' selected' : '') + '>HRM</option></select></div>' +
      '<div class="field"><label for="pf-sec">Section</label><select id="pf-sec">' + 'ABCDEF'.split('').map(s => '<option' + (p.sec === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></div></div></div>' +
      '<div class="two"><div class="field"><label for="pf-digest">Daily digest</label><select id="pf-digest">' + digest + '</select></div>' +
      '<div class="field"><span style="font-weight:600;font-size:14px">Pings</span><label class="switch" style="min-height:44px"><input type="checkbox" id="pf-must"' + (p.mustOnly ? ' checked' : '') + '>Only Must-do items ping me</label></div></div>' +
      '<fieldset class="field"><legend>Clubs and committees you follow</legend><div class="follow-grid">' + opts + '</div><span class="hint">Offices, the Placement Committee and your section CR are always on, so you never miss a must-do.</span></fieldset>' +
      '<div class="form-acts"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-act="reset">' + (ui.resetArmed ? 'Click again to reset everything' : 'Reset demo data') + '</button></div>' +
    '</form>');
}

/* ================= router & render ================= */
const VIEWS = {today:viewToday, updates:viewUpdates, committees:viewCommittees, guide:viewGuide, post:viewPost};
function render(opts){
  opts = opts || {};
  const activeId = document.activeElement && document.activeElement.id;
  renderShell();
  document.getElementById('view').innerHTML = VIEWS[ui.route]();
  if(ui.route === 'updates') renderFeed();
  if(ui.route === 'post') renderPreview();
  if(activeId && !opts.nav){ const el = document.getElementById(activeId); if(el && el !== document.body){ try{ el.focus({preventScroll:true}); }catch(e){} } }
}
function go(route, focusMain){
  if(!VIEWS[route]) route = 'today';
  const changed = route !== ui.route;
  ui.route = route;
  if(route !== 'today') ui.day = null;
  try{ if(location.hash !== '#' + route) history.replaceState(null, '', '#' + route); }catch(e){}
  render({nav:true});
  if(changed){ window.scrollTo(0,0); if(focusMain) document.getElementById('view').focus({preventScroll:true}); }
}
let toastT = null;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function copyText(text, el){
  const fallback = () => { if(el && el.select){ el.focus(); el.select(); } else if(el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('Text selected. Press Ctrl+C or Cmd+C to copy.'); };
  try{ navigator.clipboard.writeText(text).then(() => toast('Copied'), fallback); }catch(e){ fallback(); }
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if(nav){ e.preventDefault(); if(!document.getElementById('backdrop').hidden) closeSheet(); go(nav.dataset.nav, true); return; }
  if(e.target.closest('[data-stop]') && e.target.closest('summary') && !e.target.matches('input')){ return; }
  const t = e.target.closest('[data-act]');
  if(!t) { if(e.target.id === 'backdrop') closeSheet(); return; }
  const act = t.dataset.act, id = t.dataset.id;
  switch(act){
    case 'open': if(t.dataset.kind === 'r') openCommittee(id); else openUpdate(id); break;
    case 'close': closeSheet(); break;
    case 'day': { const d = Number(t.dataset.day); ui.day = ui.day === d ? null : d; render(); break; }
    case 'hide-banner': state.banner = false; save(); render(); break;
    case 'profile': openProfile(); break;
    case 'cat': ui.cat = t.dataset.cat; renderFeed(); break;
    case 'raw': { const box = document.getElementById('raw-' + id); if(box){ box.hidden = !box.hidden; t.setAttribute('aria-expanded', String(!box.hidden)); t.textContent = box.hidden ? 'Original message' : 'Hide original'; } break; }
    case 'remind': { const on = toggleIn(state.reminders, id); save(); toast(on ? 'Added to tonight’s digest' : 'Removed from your digest'); refresh(); break; }
    case 'go': { const u = findUpdate(id); toast('Prototype: “' + (u ? u.action : 'this') + '” opens the real form or page in the live app.'); break; }
    case 'done-btn': { const on = toggleIn(state.done, id); save(); toast(on ? 'Marked as done' : 'Marked as not done'); refresh(); break; }
    case 'short': { const on = toggleIn(state.shortlisted, id); if(on && !has(state.following, id)) state.following.push(id); save(); toast(on ? 'Shortlisted. Its rounds are now in Today.' : 'Removed from your shortlist'); refresh(); break; }
    case 'follow': { const on = toggleIn(state.following, id); save(); toast(on ? 'Following. Their updates show in your feed.' : 'Unfollowed'); refresh(); break; }
    case 'cfilter': ui.cfilter = t.dataset.f; render(); break;
    case 'draft-clash': openClashDraft(t.dataset.a, t.dataset.b); break;
    case 'copy-draft': { const ta = document.getElementById('draft-text'); copyText(ta.value, ta); break; }
    case 'copy-wa': copyText(waText(draft), document.getElementById('wa-text')); break;
    case 'clear-post': draft = {src:draft.src, title:'', tldr:'', cat:draft.cat, aud:'all', type:'action', pri:'must', action:'', due:'', raw:''}; render(); document.getElementById('p-title').focus(); break;
    case 'reset': if(!ui.resetArmed){ ui.resetArmed = true; t.textContent = 'Click again to reset everything'; } else { state = clone(DEFAULT_STATE); save(); draft = POST_DEFAULT(); ui.resetArmed = false; closeSheet(); toast('Demo data reset'); render(); } break;
  }
});
function refresh(){
  // re-render page and, if a sheet is open, re-open its content in place
  const sheetOpen = !document.getElementById('backdrop').hidden;
  const title = sheetOpen ? document.getElementById('sheet-title').textContent : null;
  const rawOpen = [...document.querySelectorAll('.raw[id^="raw-"]')].filter(r => !r.hidden).map(r => r.id);
  render();
  rawOpen.forEach(id => { const r = document.getElementById(id); const b = document.querySelector('[aria-controls="' + id + '"]'); if(r){ r.hidden = false; if(b){ b.setAttribute('aria-expanded','true'); b.textContent = 'Hide original'; } } });
  if(sheetOpen){
    const keepFocus = lastFocus;
    const c = COMMITTEES.find(x => x.name === title); const u = allUpdates().find(x => x.title === title);
    if(c) openCommittee(c.id); else if(u) openUpdate(u.id);
    lastFocus = keepFocus;
  }
}
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.act === 'done'){ const on = toggleIn(state.done, t.dataset.id); save(); if(on) toast('Done. One less thing.'); render(); return; }
  if(t.dataset.act === 'gdone'){ toggleIn(state.guideDone, t.dataset.id); save(); render(); return; }
  if(t.dataset.act === 'follow-only'){ ui.followOnly = t.checked; renderFeed(); return; }
  if(t.closest('#post-form')) syncDraft();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q-updates'){ ui.q = t.value; renderFeed(); return; }
  if(t.id === 'q-guide'){ ui.gq = t.value; const pos = t.selectionStart; render(); const q = document.getElementById('q-guide'); q.focus(); try{ q.setSelectionRange(pos,pos); }catch(err){} return; }
  if(t.closest('#post-form')) syncDraft();
});
function syncDraft(){
  const f = document.getElementById('post-form'); if(!f) return;
  const v = n => { const el = f.elements[n]; return el ? el.value : ''; };
  draft = {src:v('src'), title:v('title'), tldr:v('tldr'), cat:v('cat'), aud:v('aud'), type:(f.querySelector('input[name=type]:checked')||{}).value || 'action', pri:(f.querySelector('input[name=pri]:checked')||{}).value || 'must', action:v('action'), due:v('due'), raw:v('raw')};
  renderPreview();
}
document.addEventListener('submit', e => {
  if(e.target.id === 'post-form'){
    e.preventDefault(); syncDraft();
    const err = document.getElementById('post-err');
    const probs = [];
    if(draft.title.trim().length < 8) probs.push('add a title of at least 8 characters');
    if(!draft.tldr.trim()) probs.push('add a one-line summary');
    if(draft.tldr.length > 120) probs.push('shorten the summary to 120 characters');
    if(draft.type === 'action' && !draft.due) probs.push('set a deadline');
    if(draft.type === 'action' && !draft.action.trim()) probs.push('name the action button');
    if(probs.length){ err.textContent = 'To publish, ' + probs.join(', ') + '.'; err.hidden = false; return; }
    err.hidden = true;
    const it = previewItem(draft);
    const id = 'p' + Date.now();
    state.posts.unshift({id, src:it.src, cat:it.cat, pri:it.pri, aud:it.aud, posted:new Date().toISOString(), title:it.title, tldr:it.tldr, action:it.action, due:it.due ? it.due.toISOString() : null, raw:it.raw, grp:SRC[it.src].n});
    if(!SRC[it.src].off && !has(state.following, it.src)) state.following.push(it.src);
    save();
    draft = POST_DEFAULT();
    ui.fresh = id; ui.cat = 'all'; ui.q = '';
    go('updates', true);
    toast('Published. It is at the top of Updates.');
    const card = document.getElementById('card-' + id); if(card) card.scrollIntoView({block:'center'});
  }
  if(e.target.id === 'profile-form'){
    e.preventDefault();
    const name = document.getElementById('pf-name').value.trim() || 'Fresher';
    state.profile = {name, prog:document.getElementById('pf-prog').value, sec:document.getElementById('pf-sec').value, digest:document.getElementById('pf-digest').value, mustOnly:document.getElementById('pf-must').checked};
    const fol = [...document.querySelectorAll('.follow-grid input')].filter(i => i.checked).map(i => i.value);
    state.following = fol;
    state.banner = false;
    save(); closeSheet(); toast('Saved. Sorted now shows what applies to you.'); render();
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !document.getElementById('backdrop').hidden){ closeSheet(); }
  if(e.key === 'Tab' && !document.getElementById('backdrop').hidden){
    const f = [...document.getElementById('sheet').querySelectorAll('button, [href], input, select, textarea')].filter(x => !x.disabled && x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
document.getElementById('backdrop').addEventListener('click', e => { if(e.target.id === 'backdrop') closeSheet(); });
window.addEventListener('scroll', () => { document.getElementById('topbar').classList.toggle('scrolled', window.scrollY > 4); }, {passive:true});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if(VIEWS[h] && h !== ui.route) go(h); });
setInterval(() => {
  document.querySelectorAll('[data-due]').forEach(el => { const cd = countdown(new Date(Number(el.dataset.due))); el.className = 'due ' + cd.cls; const s = el.querySelector('span'); if(s) s.textContent = cd.txt; });
}, 30000);

/* boot */
const start = location.hash.slice(1);
ui.route = VIEWS[start] ? start : 'today';
render({nav:true});
})();
</script>

<div class="install" id="install" hidden role="region" aria-label="Install Sorted">
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0F1930"/><rect x="5" y="7.5" width="21" height="4.4" rx="2.2" fill="#FF6A5C"/><rect x="5" y="14.1" width="14.9" height="4.4" rx="2.2" fill="#86A2FF"/><rect x="5" y="20.7" width="8.8" height="4.4" rx="2.2" fill="#FFE14A"/></svg>
  <p id="install-text">Add Sorted to your home screen for one-tap access, even offline.</p>
  <button class="btn sm" id="install-go">Install</button>
  <button class="install-x" id="install-x" aria-label="Dismiss">&times;</button>
</div>
<style>
.install{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:12px;padding:10px 8px 10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;color:var(--ink)}
.install svg{width:34px;height:34px;flex:none}
.install p{flex:1;min-width:0;line-height:1.35}
.install-x{width:34px;height:34px;border-radius:9px;font-size:22px;line-height:1;color:var(--ink-3)}
.install-x:hover{background:var(--surface-2)}
@media (min-width:900px){.install{left:auto;right:24px;bottom:24px;max-width:400px}}
</style>
<script>
(function(){
  if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) return;
  var dismissed = false; try { dismissed = localStorage.getItem('sorted.installDismissed') === '1'; } catch (e) {}
  if (dismissed) return;
  var box = document.getElementById('install'), go = document.getElementById('install-go'), txt = document.getElementById('install-text');
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; box.hidden = false; });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) { txt.innerHTML = 'To install: tap <b>Share</b>, then <b>Add to Home Screen</b>.'; go.hidden = true; box.hidden = false; }
  go.addEventListener('click', function(){ if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function(){ deferred = null; box.hidden = true; }); });
  document.getElementById('install-x').addEventListener('click', function(){ box.hidden = true; try { localStorage.setItem('sorted.installDismissed', '1'); } catch (e) {} });
  window.addEventListener('appinstalled', function(){ box.hidden = true; });
})();
</script>
</body>
</html>
